<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="16" fill="#faf8f2"/><text x="42" y="50" font-family="Arial, sans-serif" font-size="18" fill="#a3432a" text-anchor="start">10 / READING YOUR PATTERN</text><text x="42" y="95" font-family="Arial, sans-serif" font-size="30" fill="#292e26" text-anchor="start">Counting a chain group</text><rect x="40" y="145" width="820" height="90" rx="12" fill="#e6e9dc"/><text x="65" y="182" font-family="Arial, sans-serif" font-size="24" fill="#292e26" text-anchor="start">Single crochet example: 6 worked sc + ch 1 for height</text><text x="65" y="217" font-family="Arial, sans-serif" font-size="21" fill="#a3432a" text-anchor="start">Total = 6 stitches. Turning ch 1 does not count.</text><rect x="40" y="253" width="820" height="90" rx="12" fill="#eee1d3"/><text x="65" y="290" font-family="Arial, sans-serif" font-size="24" fill="#292e26" text-anchor="start">Double crochet example: 7 worked dc + 1 chain group</text><text x="65" y="325" font-family="Arial, sans-serif" font-size="21" fill="#a3432a" text-anchor="start">Total = 8 stitches only when that group counts as one.</text></svg>
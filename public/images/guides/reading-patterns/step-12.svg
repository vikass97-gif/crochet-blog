<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="16" fill="#faf8f2"/><text x="42" y="50" font-family="Arial, sans-serif" font-size="18" fill="#a3432a" text-anchor="start">12 / READING YOUR PATTERN</text><text x="42" y="95" font-family="Arial, sans-serif" font-size="30" fill="#292e26" text-anchor="start">Find the insertion target</text><rect x="40" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="58" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">Top of a stitch</text><text x="58" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">Two strands form a V</text><text x="307" y="233" font-family="Arial, sans-serif" font-size="25" fill="#a3432a" text-anchor="middle">→</text><rect x="326" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="344" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">Chain space</text><text x="344" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">Work into the opening</text><text x="593" y="233" font-family="Arial, sans-serif" font-size="25" fill="#a3432a" text-anchor="middle">→</text><rect x="612" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="630" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">One top loop</text><text x="630" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">Front or back as stated</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="16" fill="#faf8f2"/><text x="42" y="50" font-family="Arial, sans-serif" font-size="18" fill="#a3432a" text-anchor="start">15 / READING YOUR PATTERN</text><text x="42" y="95" font-family="Arial, sans-serif" font-size="30" fill="#292e26" text-anchor="start">Work backward to the first mismatch</text><rect x="40" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="58" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">Check the edges</text><text x="58" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">First and last stitches</text><text x="307" y="233" font-family="Arial, sans-serif" font-size="25" fill="#a3432a" text-anchor="middle">→</text><rect x="326" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="344" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">Split the repeats</text><text x="344" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">Count smaller groups</text><text x="593" y="233" font-family="Arial, sans-serif" font-size="25" fill="#a3432a" text-anchor="middle">→</text><rect x="612" y="155" width="250" height="140" rx="12" fill="#e6e9dc"/><text x="630" y="208" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="start">Inspect placement</text><text x="630" y="255" font-family="Arial, sans-serif" font-size="18" fill="#66695e" text-anchor="start">Stitch or chain space?</text></svg>
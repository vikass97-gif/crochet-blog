<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="16" fill="#faf8f2"/><text x="42" y="50" font-family="Arial, sans-serif" font-size="18" fill="#a3432a" text-anchor="start">08 / READING YOUR PATTERN</text><text x="42" y="95" font-family="Arial, sans-serif" font-size="30" fill="#292e26" text-anchor="start">Repeat [1 sc, 2 sc] three times</text><rect x="90" y="152" width="230" height="163" rx="12" fill="#e6e9dc"/><text x="205" y="190" font-family="Arial, sans-serif" font-size="22" fill="#292e26" text-anchor="middle">Repeat 1</text><text x="205" y="235" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="middle">2 base stitches</text><text x="205" y="281" font-family="Arial, sans-serif" font-size="23" fill="#a3432a" text-anchor="middle">→ 3 new stitches</text><rect x="365" y="152" width="230" height="163" rx="12" fill="#e6e9dc"/><text x="480" y="190" font-family="Arial, sans-serif" font-size="22" fill="#292e26" text-anchor="middle">Repeat 2</text><text x="480" y="235" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="middle">2 base stitches</text><text x="480" y="281" font-family="Arial, sans-serif" font-size="23" fill="#a3432a" text-anchor="middle">→ 3 new stitches</text><rect x="640" y="152" width="230" height="163" rx="12" fill="#e6e9dc"/><text x="755" y="190" font-family="Arial, sans-serif" font-size="22" fill="#292e26" text-anchor="middle">Repeat 3</text><text x="755" y="235" font-family="Arial, sans-serif" font-size="23" fill="#292e26" text-anchor="middle">2 base stitches</text><text x="755" y="281" font-family="Arial, sans-serif" font-size="23" fill="#a3432a" text-anchor="middle">→ 3 new stitches</text><text x="45" y="354" font-family="Arial, sans-serif" font-size="21" fill="#292e26" text-anchor="start">3 repeats × 2 base stitches = 6 used; 3 × 3 = 9 produced.</text></svg>